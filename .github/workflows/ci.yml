name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang
          - os: macos-latest
            compiler: clang
          - os: windows-latest
            compiler: msvc

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DCW_BUILD_TESTS=ON
          -DCW_BUILD_GAMES=ON
          -DCW_BUILD_EXAMPLES=ON
          -DCW_BUILD_GUI=OFF

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build
          -DCW_BUILD_TESTS=ON
          -DCW_BUILD_GAMES=ON
          -DCW_BUILD_EXAMPLES=ON
          -DCW_BUILD_GUI=OFF

      - name: Build
        run: cmake --build build --config Debug --parallel 2

      - name: Run regression tests
        run: ctest --test-dir build --build-config Debug --output-on-failure --parallel 2
