# sandbox3d rendering settings (render2d tunables): the 3D view is composited
# through the 2D post-process stack, so the 2D-only passes (lighting, fog)
# stay off and the screen effects are kept to tone mapping.
[lighting]
enabled = false
[fog]
enabled = false
[bloom]
enabled = false
[motion_blur]
enabled = false
[chromatic_aberration]
enabled = false
[vignette]
enabled = false
