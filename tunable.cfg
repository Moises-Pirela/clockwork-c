# render2d post-process tunables. Edit while the demo runs: it reloads the file automatically (F6 forces a reload, F7 opens the tuning panel, F8 saves the panel's values back here).

[post]
# run the post-process stack (off draws straight to the window) [true/false]
enabled = true
# render the scene into RGBA16F targets so bloom can exceed 1.0 [true/false]
hdr = true
# post-process the screen-space UI layer as well [true/false]
apply_to_ui = false
# scene resolution relative to the window (tiers may lower it) [0.25 .. 1]
render_scale = 1.0

[quality]
# device tier, or auto: pick from the device and adjust from frame times [auto|low|medium|high|ultra]
tier = auto
# with auto: lower the tier when over budget, raise it when there is headroom [true/false]
auto_adjust = true
# frame rate the automatic adjustment aims for [15 .. 240]
target_fps = 60.0
# lowest tier the automatic adjustment may choose [low|medium|high|ultra]
min_tier = low
# highest tier the automatic adjustment may choose [low|medium|high|ultra]
max_tier = ultra

[stack]
# passes to run, first runs first: lighting, bloom, dof, motion_blur, chromatic_aberration, tonemap, vignette, shake
order = lighting, bloom, dof, motion_blur, chromatic_aberration, tonemap, vignette, shake

[lighting]
# 2D lights with soft shadows and volumetric in-scatter (needs the stack) [true/false]
enabled = true
# ambient light color red [0 .. 2]
ambient_r = 0.55
# ambient light color green [0 .. 2]
ambient_g = 0.6
# ambient light color blue [0 .. 2]
ambient_b = 0.75
# ambient intensity (1 with white color = unlit look) [0 .. 3]
ambient = 0.32
# multiplier for every light [0 .. 5]
intensity = 1.0
# multiplier for the in-scattered (shaft) light [0 .. 5]
volumetric = 1.0
# volumetric light visible even where there is no fog [0 .. 1]
haze = 0.18
# penumbra width in shadow map steps [0 .. 8]
shadow_softness = 1.5
# polar shadow map resolution per light [64 .. 4096]
shadow_angles = 720
# resolution divisor of the lightmap [1 .. 8]
downscale = 2
# lights rendered per frame (the first submitted win) [1 .. 64]
max_lights = 64
# default falloff exponent of (1 - distance / radius) [0.25 .. 6]
falloff = 2.0

[fog]
# animated fog lit by the lights [true/false]
enabled = true
# overall fog amount [0 .. 1]
density = 0.3
# fog color red [0 .. 2]
color_r = 0.62
# fog color green [0 .. 2]
color_g = 0.66
# fog color blue [0 .. 2]
color_b = 0.74
# size of the noise features in world units [10 .. 2000]
scale = 220.0
# wind, world units per second [-200 .. 200]
speed_x = 18.0
# wind, world units per second [-200 .. 200]
speed_y = 6.0
# sharpens the noise (1 = raw) [0.2 .. 6]
contrast = 2.0
# noise detail levels [1 .. 6]
octaves = 4
# ambient light received by the fog [0 .. 3]
ambient = 0.25
# direct light received by the fog [0 .. 3]
direct = 0.6

[bloom]
# glow around bright pixels [true/false]
enabled = true
# brightness where pixels start to bloom [0 .. 4]
threshold = 0.75
# softness of the threshold transition [0 .. 1]
soft_knee = 0.5
# strength of the added glow [0 .. 5]
intensity = 0.9
# blur radius in texels of the downscaled image [0.25 .. 8]
radius = 1.6
# blur iterations (wider glow per pass) [1 .. 8]
passes = 3
# resolution divisor of the bloom buffers [1 .. 8]
downscale = 2

[dof]
# depth of field: blur away from a focus point or band [true/false]
enabled = false
# focus region shape (bands give a tilt-shift look) [radial|horizontal_band|vertical_band]
shape = radial
# focus center, fraction of the screen width from the left [0 .. 1]
focus_x = 0.5
# focus center, fraction of the screen height from the top [0 .. 1]
focus_y = 0.5
# radius of the sharp region (screen fractions) [0 .. 1.5]
focus_radius = 0.2
# distance over which sharp turns into blurred [0.01 .. 1.5]
falloff = 0.35
# blur radius in texels of the half-resolution copy [0.25 .. 8]
blur_radius = 2.0
# blur iterations [1 .. 6]
blur_passes = 2
# how much of the blurred copy is mixed in at full distance [0 .. 1]
max_blur = 1.0

[motion_blur]
# blur along the camera's motion between frames [true/false]
enabled = true
# fraction of the per-frame camera movement to smear over [0 .. 4]
strength = 0.6
# longest smear in pixels [0 .. 400]
max_offset = 48.0
# radial blur per unit of zoom change [0 .. 20]
zoom_strength = 4.0
# taps along the motion vector [2 .. 32]
samples = 8

[chromatic_aberration]
# separate the color channels towards the edges [true/false]
enabled = true
# channel offset at the edge, in screen fractions [0 .. 0.05]
strength = 0.006
# center of the effect, fraction from the left [0 .. 1]
center_x = 0.5
# center of the effect, fraction from the top [0 .. 1]
center_y = 0.5
# exponent of the growth with distance from the center [0.1 .. 6]
falloff = 1.5

[tonemap]
# exposure, tone curve and color grading [true/false]
enabled = true
# tone curve [none|reinhard|aces|filmic]
operator = aces
# multiplier before the tone curve [0 .. 8]
exposure = 1.0
# output gamma (1 = unchanged) [0.2 .. 4]
gamma = 1.0
# 0 = grayscale, 1 = unchanged [0 .. 3]
saturation = 1.15
# contrast around mid gray [0 .. 3]
contrast = 1.12
# added after contrast [-1 .. 1]
brightness = 0.0

[vignette]
# darken towards the edges [true/false]
enabled = true
# distance from the center where the vignette is fully applied [0 .. 2]
radius = 1.25
# width of the transition [0.01 .. 2]
softness = 0.7
# how strongly the edges are tinted [0 .. 1]
intensity = 0.55
# 0 follows the window shape, 1 is circular [0 .. 1]
roundness = 0.5
# tint color red [0 .. 1]
color_r = 0.0
# tint color green [0 .. 1]
color_g = 0.0
# tint color blue [0 .. 1]
color_b = 0.02

[shake]
# camera shake applied to the final image from accumulated trauma [true/false]
enabled = true
# largest offset in pixels at full trauma [0 .. 200]
max_offset = 18.0
# largest rotation in degrees at full trauma [0 .. 20]
max_angle = 1.5
# shake speed in hertz [1 .. 120]
frequency = 24.0
# trauma lost per second [0.1 .. 20]
decay = 1.8
# shake = trauma ^ exponent (higher = more contrast between small and big hits) [1 .. 4]
exponent = 2.0

[tier_low]
# scene resolution relative to the window [0.25 .. 1]
render_scale = 0.7
# RGBA16F targets allowed [true/false]
hdr = false
# window sample count to request at startup [1 .. 8]
msaa = 1
# bloom blur iterations at most [1 .. 8]
bloom_passes = 1
# bloom buffers at least this much smaller [1 .. 8]
bloom_downscale = 4
# depth of field allowed [true/false]
allow_dof = false
# depth of field blur iterations at most [1 .. 6]
dof_passes = 1
# motion blur allowed [true/false]
allow_motion_blur = false
# motion blur taps at most [2 .. 32]
motion_samples = 4
# lights and shadows allowed [true/false]
allow_lighting = true
# fog allowed [true/false]
allow_fog = false
# lightmap at least this much smaller [1 .. 8]
lighting_downscale = 4
# shadow map resolution at most [64 .. 4096]
shadow_angles = 180
# lights per frame at most [1 .. 64]
max_lights = 12
# fog noise octaves at most [1 .. 6]
fog_octaves = 2
# multiplier for particle counts and emitter rates [0 .. 4]
particle_scale = 0.35

[tier_medium]
# scene resolution relative to the window [0.25 .. 1]
render_scale = 0.85
# RGBA16F targets allowed [true/false]
hdr = true
# window sample count to request at startup [1 .. 8]
msaa = 2
# bloom blur iterations at most [1 .. 8]
bloom_passes = 2
# bloom buffers at least this much smaller [1 .. 8]
bloom_downscale = 4
# depth of field allowed [true/false]
allow_dof = true
# depth of field blur iterations at most [1 .. 6]
dof_passes = 1
# motion blur allowed [true/false]
allow_motion_blur = true
# motion blur taps at most [2 .. 32]
motion_samples = 6
# lights and shadows allowed [true/false]
allow_lighting = true
# fog allowed [true/false]
allow_fog = true
# lightmap at least this much smaller [1 .. 8]
lighting_downscale = 3
# shadow map resolution at most [64 .. 4096]
shadow_angles = 360
# lights per frame at most [1 .. 64]
max_lights = 24
# fog noise octaves at most [1 .. 6]
fog_octaves = 3
# multiplier for particle counts and emitter rates [0 .. 4]
particle_scale = 0.6

[tier_high]
# scene resolution relative to the window [0.25 .. 1]
render_scale = 1.0
# RGBA16F targets allowed [true/false]
hdr = true
# window sample count to request at startup [1 .. 8]
msaa = 4
# bloom blur iterations at most [1 .. 8]
bloom_passes = 3
# bloom buffers at least this much smaller [1 .. 8]
bloom_downscale = 2
# depth of field allowed [true/false]
allow_dof = true
# depth of field blur iterations at most [1 .. 6]
dof_passes = 2
# motion blur allowed [true/false]
allow_motion_blur = true
# motion blur taps at most [2 .. 32]
motion_samples = 8
# lights and shadows allowed [true/false]
allow_lighting = true
# fog allowed [true/false]
allow_fog = true
# lightmap at least this much smaller [1 .. 8]
lighting_downscale = 2
# shadow map resolution at most [64 .. 4096]
shadow_angles = 720
# lights per frame at most [1 .. 64]
max_lights = 48
# fog noise octaves at most [1 .. 6]
fog_octaves = 4
# multiplier for particle counts and emitter rates [0 .. 4]
particle_scale = 1.0

[tier_ultra]
# scene resolution relative to the window [0.25 .. 1]
render_scale = 1.0
# RGBA16F targets allowed [true/false]
hdr = true
# window sample count to request at startup [1 .. 8]
msaa = 8
# bloom blur iterations at most [1 .. 8]
bloom_passes = 4
# bloom buffers at least this much smaller [1 .. 8]
bloom_downscale = 2
# depth of field allowed [true/false]
allow_dof = true
# depth of field blur iterations at most [1 .. 6]
dof_passes = 3
# motion blur allowed [true/false]
allow_motion_blur = true
# motion blur taps at most [2 .. 32]
motion_samples = 16
# lights and shadows allowed [true/false]
allow_lighting = true
# fog allowed [true/false]
allow_fog = true
# lightmap at least this much smaller [1 .. 8]
lighting_downscale = 1
# shadow map resolution at most [64 .. 4096]
shadow_angles = 1440
# lights per frame at most [1 .. 64]
max_lights = 64
# fog noise octaves at most [1 .. 6]
fog_octaves = 6
# multiplier for particle counts and emitter rates [0 .. 4]
particle_scale = 1.5
